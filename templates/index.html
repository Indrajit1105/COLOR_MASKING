<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bag Color Changer</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: #f4f7fc;
            color: #333;
            text-align: center;
            padding: 50px;
            margin: 0;
        }

        h1 {
            color: #4A90E2;
            font-size: 36px;
            margin-bottom: 30px;
        }

        .container {
            background: #fff;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            border-radius: 8px;
            padding: 40px;
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
        }

        input[type="text"], input[type="color"], button {
            padding: 12px;
            font-size: 16px;
            border-radius: 8px;
            border: 1px solid #ddd;
            width: 100%;
            margin: 10px 0;
            box-sizing: border-box;
            transition: 0.3s;
        }

        input[type="text"]:focus, input[type="color"]:focus, button:focus {
            outline: none;
            border-color: #4A90E2;
        }

        button {
            background-color: #4A90E2;
            color: white;
            cursor: pointer;
            font-weight: bold;
            margin-top: 20px;
            transition: 0.3s;
        }

        button:hover {
            background-color: #357ABD;
        }

        .image-container {
            margin-top: 30px;
            border-radius: 8px;
            overflow: hidden;
        }

        /* img {
            width: auto;
            height:auto;
            border-radius: 8px;
        } */

        .download-btn {
            margin-top: 20px;
            background-color: #28a745;
            color: white;
            font-size: 18px;
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
        }

        .download-btn:hover {
            background-color: #218838;
        }



    </style>
</head>
<body>

    <h1>Change the Bag Color</h1>
    
    <div class="container">
        <form method="POST">
            <label for="color_text">Enter Hex Color (e.g., #ff0000):</label><br>
            <input type="text" id="color_text" name="color_text" placeholder="Enter Hex Color" value="{{ selected }}" pattern="^#([A-Fa-f0-9]{6})$" required>
            <button type="submit">Apply</button>
        </form>

        <div class="image-container">
            <img src="{{ image }}" alt="Recolored Bag">
        </div>

        <a href="{{ image }}" download="recolored_bag.jpg">
            <button class="download-btn">Download Image</button>
        </a>
    </div>


</body>
</html>
