<!-- templates/index.html -->
<!DOCTYPE html>
<html>
<head>
    <title>Bag Color Changer</title>
    <style>
        body { font-family: Arial; text-align: center; padding: 30px; }
        img { width: 300px; border: 1px solid #ccc; margin-top: 20px; }
        select, button { padding: 10px; font-size: 16px; margin: 10px; }
    </style>
</head>
<body>
    <h1>Change the Bag Color</h1>
    <form method="POST">
        <select name="color">
            {% for color in colors %}
                <option value="{{ color }}" {% if color == selected %}selected{% endif %}>{{ color }}</option>
            {% endfor %}
        </select>
        <button type="submit">Apply</button>
    </form>
    <img src="{{ image }}" alt="Recolored Bag">
</body>
</html>
